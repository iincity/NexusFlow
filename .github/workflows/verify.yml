name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-inputs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Verify root diff whitespace
        shell: pwsh
        run: git diff --check HEAD^ HEAD
      - name: Generate SBOM
        shell: pwsh
        run: ./tools/generate-sbom.ps1
      - name: Verify BOM and release inputs
        shell: pwsh
        run: ./tools/verify-release.ps1
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: nexusflow-sbom
          path: release/sbom.cdx.json

  rust-workspaces:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Tunnel workspace
        working-directory: components/nexus-tunnel
        shell: pwsh
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked --workspace
          cargo test --locked -p nexus-tunnel-server --features test-loopback --test relay_process_e2e -- --test-threads=1
          cargo clippy --locked --workspace --all-features -- -D warnings
      - name: Verify control-plane library
        working-directory: components/nexus-platform/control-plane
        shell: pwsh
        run: cargo check --locked --lib
      - name: Verify control-plane final acceptance suites
        working-directory: components/nexus-platform/control-plane
        shell: pwsh
        run: |
          # Keep the real Socket.IO client test-only: no Node package is added
          # to the control-plane runtime or container image.
          $socketTestDeps = Join-Path $env:RUNNER_TEMP 'nexusflow-socket-test-deps'
          npm install --prefix $socketTestDeps --no-save socket.io-client@4.8.1
          $env:NODE_PATH = Join-Path $socketTestDeps 'node_modules'
          cargo fmt --check
          cargo test --locked -- --test-threads=1
          cargo clippy --locked --workspace --all-features -- -D warnings
      - name: Build control-plane container
        shell: pwsh
        run: docker build --file components/nexus-platform/control-plane/Dockerfile .
      - name: Verify WebRelay artifact
        working-directory: components/nexus-platform/control-plane
        shell: pwsh
        run: |
          cargo check --locked --bin nexus-web-relay
          cargo test --locked --bin nexus-web-relay -- --test-threads=1
          docker build --file ../../../deploy/docker/nexus-web-relay.Dockerfile ../../..
      - name: Verify Admin Web syntax
        working-directory: components/nexus-platform/admin-web
        shell: pwsh
        run: node --check app.js
      - name: Verify RustDesk without Nexus
        working-directory: components/nexus-rustdesk
        shell: pwsh
        run: |
          python res/inline-sciter.py
          cargo check --locked -p rustdesk --features use_dasp
          cargo fmt -p nexus_client --check
      - name: Verify RustDesk with Nexus
        working-directory: components/nexus-rustdesk
        shell: pwsh
        run: |
          python res/inline-sciter.py
          cargo check --locked -p rustdesk --features nexus
          cargo check --locked -p rustdesk --features nexus-native-tunnel
          cargo test --locked -p nexus_client -- --test-threads=1
          $rustdeskForbidden = cargo tree --locked -e normal,build -p rustdesk --features nexus-native-tunnel | Select-String 'nexus-tunnel|frp-rs|nexus-frp-runtime'
          if ($LASTEXITCODE -ne 0) { throw 'RustDesk native dependency tree failed' }
          if ($rustdeskForbidden) { $rustdeskForbidden; throw 'RustDesk native build links retired Tunnel/FRP runtime' }
      - name: Verify RustDesk Server formatting
        working-directory: components/rustdesk-server
        shell: pwsh
        run: |
          cargo check --locked --features nexus-native-tunnel --bin hbbs
          cargo fmt --check
      - name: Verify control-plane native dependency boundary
        working-directory: components/nexus-platform/control-plane
        shell: pwsh
        run: |
          $controlForbidden = cargo tree --locked -e normal,build | Select-String 'nexus-tunnel|frp-rs|nexus-frp-runtime'
          if ($LASTEXITCODE -ne 0) { throw 'Control-plane production dependency tree failed' }
          if ($controlForbidden) { $controlForbidden; throw 'Control-plane production build links retired Tunnel/FRP runtime' }
          $sourceAdapter = rg -n '\#\[path\s*=.*nexus-tunnel|\.\./\.\./\.\./\.\./nexus-tunnel' src
          if ($LASTEXITCODE -notin 0, 1) { throw 'Control-plane source adapter scan failed' }
          if ($sourceAdapter) { $sourceAdapter; throw 'Control-plane production source imports retired Tunnel runtime' }

  linux-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Linux-safe workspaces
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path components/nexus-tunnel/Cargo.toml
          cargo check --locked --manifest-path components/nexus-tunnel/Cargo.toml --all-targets
          cargo test --locked --manifest-path components/nexus-tunnel/Cargo.toml --workspace -- --test-threads=1
          cargo test --locked --manifest-path components/nexus-tunnel/Cargo.toml -p nexus-tunnel-server --features test-loopback --test relay_process_e2e -- --test-threads=1
          cargo test --locked --manifest-path components/nexus-rustdesk/libs/nexus_client/Cargo.toml -- --test-threads=1
          cd components/nexus-rustdesk
          python3 res/inline-sciter.py
          cargo check --locked -p rustdesk --features nexus-native-tunnel
          cargo fmt -p nexus_client --check
          cd ../rustdesk-server
          cargo check --locked --features nexus-native-tunnel --bin hbbs
          cargo fmt --check
      - name: Verify hbbs native registration projection isolation
        working-directory: components/rustdesk-server
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --features nexus-native-tunnel --test nexus_registration_process -- --test-threads=1
      - name: Verify WebSocket gateway security on Linux
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path components/nexus-platform/control-plane/Cargo.toml websocket_ -- --test-threads=1

      - name: Run native RustDesk smoke harness
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/nexusflow-native-smoke"
          bash tests/e2e/native-rustdesk-tunnel/run.sh \
            --target-root "$smoke_root" \
            --matrix smoke \
            --transport direct
          test "$(jq -r '.result' "$smoke_root/result.json")" = passed

      - name: Upload native RustDesk smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexusflow-native-rustdesk-smoke
          path: |
            ${{ runner.temp }}/nexusflow-native-smoke/result.json
            ${{ runner.temp }}/nexusflow-native-smoke/logs/*.log

      - name: Verify frozen RustDesk Pro Web Client artifact
        shell: bash
        run: |
          set -euo pipefail
          pro_section=$(awk '/^\[rustdesk_pro_web_client\]/{on=1; next} on && /^\[/{exit} on {print}' release/bom.toml)
          url=$(printf '%s\n' "$pro_section" | sed -n 's/^archive_url = "\(.*\)"$/\1/p')
          digest=$(printf '%s\n' "$pro_section" | sed -n 's/^sha256 = "\([0-9a-f]*\)"$/\1/p')
          version=$(printf '%s\n' "$pro_section" | sed -n 's/^version = "\(.*\)"$/\1/p')
          static_path=$(printf '%s\n' "$pro_section" | sed -n 's/^static_path = "\(.*\)"$/\1/p')
          web_client_version=$(printf '%s\n' "$pro_section" | sed -n 's/^web_client_version = "\(.*\)"$/\1/p')
          test -n "$url" && test -n "$digest" && test -n "$version" && test -n "$static_path" && test -n "$web_client_version"
          curl --fail --location --retry 3 --output rustdesk-pro.tar.gz "$url"
          echo "$digest  rustdesk-pro.tar.gz" | sha256sum --check --strict
          tar -tzf rustdesk-pro.tar.gz | grep -qx "$static_path/version.json"
          actual_web_client_version=$(tar -xOf rustdesk-pro.tar.gz "$static_path/version.json" | jq -r '.version + "+" + .build_number')
          test "$actual_web_client_version" = "$web_client_version"

  supabase-gate:
    if: ${{ github.event_name == 'push' && secrets.DATABASE_URL != '' && secrets.MIGRATION_DATABASE_URL != '' && secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.SUPABASE_ANON_KEY != '' && secrets.NEXUS_TENANT_A_ID != '' && secrets.NEXUS_TENANT_B_ID != '' && secrets.NEXUS_TENANT_A_ACCESS_TOKEN != '' && secrets.NEXUS_TENANT_B_ACCESS_TOKEN != '' && secrets.NEXUS_REMOVED_MEMBER_TENANT_ID != '' && secrets.NEXUS_REMOVED_MEMBER_ACCESS_TOKEN != '' && secrets.NEXUS_REVOKED_ACCESS_TOKEN != '' && secrets.NEXUS_STORAGE_OBJECT_KEY != '' && secrets.NEXUS_STORAGE_OBJECT_SHA256 != '' && secrets.NEXUS_CONTROL_PLANE_URL != '' && secrets.NEXUS_REVOKED_FILE_GRANT_ID != '' }}
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify Supabase schema, RLS, Auth, Storage and revocation
        shell: pwsh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXUS_TENANT_A_ID: ${{ secrets.NEXUS_TENANT_A_ID }}
          NEXUS_TENANT_B_ID: ${{ secrets.NEXUS_TENANT_B_ID }}
          NEXUS_TENANT_A_ACCESS_TOKEN: ${{ secrets.NEXUS_TENANT_A_ACCESS_TOKEN }}
          NEXUS_TENANT_B_ACCESS_TOKEN: ${{ secrets.NEXUS_TENANT_B_ACCESS_TOKEN }}
          NEXUS_REMOVED_MEMBER_TENANT_ID: ${{ secrets.NEXUS_REMOVED_MEMBER_TENANT_ID }}
          NEXUS_REMOVED_MEMBER_ACCESS_TOKEN: ${{ secrets.NEXUS_REMOVED_MEMBER_ACCESS_TOKEN }}
          NEXUS_REVOKED_ACCESS_TOKEN: ${{ secrets.NEXUS_REVOKED_ACCESS_TOKEN }}
          NEXUS_STORAGE_OBJECT_KEY: ${{ secrets.NEXUS_STORAGE_OBJECT_KEY }}
          NEXUS_STORAGE_OBJECT_SHA256: ${{ secrets.NEXUS_STORAGE_OBJECT_SHA256 }}
          NEXUS_CONTROL_PLANE_URL: ${{ secrets.NEXUS_CONTROL_PLANE_URL }}
          NEXUS_REVOKED_FILE_GRANT_ID: ${{ secrets.NEXUS_REVOKED_FILE_GRANT_ID }}
        run: ./tools/verify-supabase.ps1
