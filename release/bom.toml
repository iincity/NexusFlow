upstream_commit = "947cb3f17b673b55dfcbe95b318749f8b44a7f7a"

[rustdesk_server]
repository = "https://github.com/iincity/rustdesk-server.git"
commit = "efedf10c81595748811df9797ff6e0827de62795"
upstream_repository = "https://github.com/rustdesk/rustdesk-server.git"
upstream_commit = "a7736be5e40f85bfc141120dce587e836e5d4b80"

[hbb_common]
repository = "https://github.com/iincity/hbb_common.git"
commit = "a3cb157484b4a77426cb4e2e43e3b03bd1a51f8b"

[rustdesk_server_pro]
repository = "https://github.com/iincity/rustdesk-server-pro.git"
commit = "2494b75b802d6008b6d7c877acf8b39a84a9fb8c"

# Public upstream artifact provenance only. A deployment still needs its
# separately managed RustDesk Pro license and operational configuration.
[rustdesk_pro_web_client]
version = "1.8.5"
web_client_version = "1.4.9+67"
archive_url = "https://github.com/rustdesk/rustdesk-server-pro/releases/download/1.8.5/rustdesk-server-linux-amd64.tar.gz"
sha256 = "fe84fc807efadc6f617c5c9ce41be656c471f39f837ab0ae66815af9f099602c"
static_path = "amd64/static/web"
api_port = 21114
websocket_port = 21118

[nexus_platform]
repository = "https://github.com/iincity/nexus-platform.git"
commit = "9c0fb3144ee5030249fbd71dd003e4aa6af57e30"

[nexus_tunnel]
repository = "https://github.com/iincity/nexus-tunnel.git"
commit = "e2faa3ab06db86fb7377717c08032c5d5c50082e"
protocol_version = "0"

[nexus_control_plane]
version = "0.1.0"
commit = "9c0fb3144ee5030249fbd71dd003e4aa6af57e30"
api_version = "v1-compat"

[nexus_web_relay]
source = "components/nexus-platform/control-plane/src/bin/nexus-web-relay.rs"
dockerfile = "deploy/docker/nexus-web-relay.Dockerfile"
kubernetes_manifest = "deploy/kubernetes/nexus-web-relay.yaml"
commit = "9c0fb3144ee5030249fbd71dd003e4aa6af57e30"

[compatibility]
min_client_version = "pending"
min_tunnel_protocol = "0"
min_control_plane_api = "v1-compat"
