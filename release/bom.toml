commit = "2494b75b802d6008b6d7c877acf8b39a84a9fb8c"

# Public upstream artifact provenance only. A deployment still needs its
# separately managed RustDesk Pro license and operational configuration.
[rustdesk_pro_web_client]
version = "1.8.5"
web_client_version = "1.4.9+67"
archive_url = "https://github.com/rustdesk/rustdesk-server-pro/releases/download/1.8.5/rustdesk-server-linux-amd64.tar.gz"
