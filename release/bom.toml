static_path = "amd64/static/web"
api_port = 21114
websocket_port = 21118

[nexus_platform]
repository = "https://github.com/iincity/nexus-platform.git"
commit = "29a6adf6fd469b25a54b0b7c912115f188ce8a16"

[nexus_tunnel]
repository = "https://github.com/iincity/nexus-tunnel.git"
commit = "5b8e96d3ec201ec65ce96bf129bbef28038bad6c"
protocol_version = "0"

[nexus_control_plane]
version = "0.1.0"
commit = "29a6adf6fd469b25a54b0b7c912115f188ce8a16"
api_version = "v1-compat"

[nexus_web_relay]
source = "components/nexus-platform/control-plane/src/bin/nexus-web-relay.rs"
dockerfile = "deploy/docker/nexus-web-relay.Dockerfile"
kubernetes_manifest = "deploy/kubernetes/nexus-web-relay.yaml"
commit = "29a6adf6fd469b25a54b0b7c912115f188ce8a16"

[compatibility]
min_client_version = "pending"
min_tunnel_protocol = "0"
min_control_plane_api = "v1-compat"
